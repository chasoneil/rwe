
<style>
    .rem-btn {
        width: 100px;
        height: 80px;
        border: 1px solid #fff;
        border-radius : 10px;
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);
        padding: 30px;
    }
</style>

<body class="gray-bg">
    <div class="wrapper wrapper-content animated fadeInRight">
        <div class="col-sm-12">
            <div class="ibox-body">
                <div class="fixed-table-toolbar">
                    <div class="columns pull-left">
                        <button type="button" class="btn btn-success" onclick="window.location.href='/rwe/jp/rem'">
                            <i class="fa fa-undo" aria-hidden="true"></i> 重新选择课程
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="row" style="margin-top:200px;">
            <input th:value="${lessonId}" type="hidden" id="lessonId">
            <div class="col-sm-4"></div>
            <div class="col-sm-4">
                <div class="row" id="do-rem-container">
                    <div class="col-sm-4">
                        <a onclick="listWords()">
                            <div class="rem-btn">
                                <div style="text-align:center;font-size:14px;">
                                    <i class="fa fa-book"></i>
                                </div>
                                <div style="margin-top:5px;"><strong>本课单词</strong></div>
                            </div>
                        </a>
                    </div>
                    <div class="col-sm-4">
                        <a onclick="remWord()">
                            <div class="rem-btn">
                                <div style="text-align:center;font-size:14px;">
                                    <i class="fa fa-book"></i>
                                </div>
                                <div style="margin-top:5px;"><strong>背单词</strong></div>
                            </div>
                        </a>
                    </div>
                    <div class="col-sm-4">
                        <a onclick="doTest()">
                            <div class="rem-btn">
                                <div style="text-align:center;font-size:14px;">
                                    <i class="fa fa-book"></i>
                                </div>
                                <div style="margin-top:5px;"><strong>单词测试</strong></div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-sm-4"></div>
        </div>

    </div>
    <script type="text/javascript" src="/js/appjs/rwe/jp/rem/rem.js"></script>
</body>
