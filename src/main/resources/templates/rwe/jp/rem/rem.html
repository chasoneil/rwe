
<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<meta charset="utf-8">
<head th:include="include :: header"></head>

<style>
    .word-content {
        font-size: 22px;
        font-weight: bold;
        text-align:center;
    }
    .word-title {
        font-size: 18px;
        text-align:center;
    }
    .blurred-span {
        filter: blur(5px);
    }
</style>

<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <form class="form-horizontal m-t" id="selectForm">
                    <div class="form-group" style="text-align: center;">
                        <div class="radio radio-info radio-inline">
                            <input type="radio" id="inlineRadio1" value="2" name="practiceType" onclick="changePType('2')">
                            <label for="inlineRadio1"> 中译日(假名) </label>
                        </div>
                        <div class="radio radio-info radio-inline">
                            <input type="radio" id="inlineRadio2" value="1" name="practiceType" onclick="changePType('1')" checked="checked">
                            <label for="inlineRadio2"> 日译中 </label>
                        </div>
                        <div class="radio radio-info radio-inline">
                            <input type="radio" id="inlineRadio3" value="3" name="practiceType" onclick="changePType('3')">
                            <label for="inlineRadio3"> 中译日(单词) </label>
                        </div>
                        <div class="radio radio-info radio-inline">
                            <input type="radio" id="inlineRadio4" value="4" name="practiceType" onclick="changePType('4')">
                            <label for="inlineRadio4">  随机 </label>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="row" style="margin-top:100px;">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <input th:value="${lessonId}" type="hidden" id="lessonId">
                <input type="hidden" id="testType">
                <form class="form-horizontal m-t" id="signupForm">
                    <div class="form-group" style="text-align:center;">
                        <div class="word-title">
                            <span id="word_jia" onclick="show('word_jia')">わたし</span>
                            [<span id="word_voice">-</span>]
                        </div>
                        <div class="word-content">
                            <div id="word_cn" onclick="show('word_cn')">私</div>
                        </div>
                        <div>
                            <div id="word_mean" onclick="show('word_mean')">我</div>
                        </div>
                        <div>
                            <div id="word_type">--</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-12" style="text-align:center;margin-top: 20px;">
                            <!-- <button type="button" class="btn btn-default" onclick="prev()">
                                <i class="fa fa-step-backward" aria-hidden="true"></i> 上一个
                            </button> -->
                            <button type="button" class="btn btn-success" onclick="passed()">
                                <i class="fa fa-angellist" aria-hidden="true"></i> 已学会
                            </button>
                            <button type="button" class="btn btn-default" onclick="next()">
                                <i class="fa fa-step-forward" aria-hidden="true"></i> 下一个
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:include="include::footer"></div>
<script type="text/javascript" src="/js/appjs/rwe/jp/rem/rem.js"></script>
</body>
</html>
