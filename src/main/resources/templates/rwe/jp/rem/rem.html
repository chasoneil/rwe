
<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<meta charset="utf-8">
<head th:include="include :: header"></head>

<style>
    .word-content {
        font-size: 22px;
        font-weight: bold;
        text-align:center;
    }
    .word-title {
        font-size: 18px;
        text-align:center;
    }
</style>

<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <form class="form-horizontal m-t" id="selectForm">
                    <div class="form-group">
                        <span class="col-sm-3">
                            中译日(假名)<input type="radio" name="practiceType" value="2">
                        </span>
                        <span class="col-sm-3">
                            中译日(单词)<input type="radio" name="practiceType" value="3">
                        </span>
                        <span class="col-sm-3">
                            日译中<input type="radio" name="practiceType" value="1">
                        </span>
                        <span class="col-sm-3">
                            随机<input type="radio" name="practiceType" value="4">
                        </span>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="row" style="margin-top:100px;">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <input th:value="${lessonId}" type="hidden" id="lessonId">
                <input type="hidden" id="testType">
                <form class="form-horizontal m-t" id="signupForm">
                    <div class="form-group" style="text-align:center;">
                        <div class="word-title">
                            <span id="word_jia">わたし</span>
                            [<span id="word_voice">-</span>]
                        </div>
                        <div class="word-content">
                            <div id="word_cn">私</div>
                        </div>
                        <div>
                            <div id="word_mean">我</div>
                        </div>
                        <div>
                            <div id="word_type">--</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-12" style="text-align:center;margin-top: 20px;">
                            <!-- <button type="button" class="btn btn-default" onclick="prev()">
                                <i class="fa fa-step-backward" aria-hidden="true"></i> 上一个
                            </button> -->
                            <button type="button" class="btn btn-success" onclick="passed()">
                                <i class="fa fa-angellist" aria-hidden="true"></i> 已学会
                            </button>
                            <button type="button" class="btn btn-default" onclick="next()">
                                <i class="fa fa-step-forward" aria-hidden="true"></i> 下一个
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:include="include::footer"></div>
<script type="text/javascript" src="/js/appjs/rwe/jp/rem/rem.js"></script>
</body>
</html>
