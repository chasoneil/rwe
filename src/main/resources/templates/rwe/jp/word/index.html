<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.w3.org/1999/xhtml">
<meta charset="utf-8">
<head th:include="include :: header"></head>

<body class="gray-bg">
    <div class="wrapper wrapper-content ">
        <div class="col-sm-12">
            <div class="ibox-body">
                <div class="fixed-table-toolbar">
                    <div class="columns pull-left">
                        <button type="button" class="btn btn-danger" onclick="batchRemove()">
                            <i class="fa fa-remove"></i> 批量删除
                        </button>
                        <button type="button" class="btn btn-default" onclick="refreshPage()">
                            <i class="fa fa-refresh" aria-hidden="true"></i> 刷新
                        </button>
                    </div>

                    <div class="columns pull-right" style="margin-left: 5px;">
                        <button class="btn btn-success" onclick="reload()"> 查询</button>
                    </div>
                    <div class="columns pull-right" style="margin-left: 5px;">
                        <select data-placeholder="选择课程..." id="lesson" class="chosen-select" style="width:220px;" tabindex="2">
                            <option value="-1">选择课程</option>
                            <option th:each="lesson, index : ${lessons}" th:value="${lesson.id}"
                                    th:text="${lesson.lesson}"></option>
                        </select>
                    </div>

                    <div class="columns pull-right input-group">
                        <input id="searchWord" type="text" class="form-control" placeholder="请输入单词">
                    </div>
                </div>
            </div>
        </div>
        <table id="exampleTable" data-mobile-responsive="true"></table>
    </div>

    <div th:include="include :: footer"></div>
    <script type="text/javascript" src="/js/appjs/rwe/jp/word/index.js"></script>
    </body>
</html>
