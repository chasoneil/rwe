<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
	<div class="wrapper wrapper-content ">
		<div class="row">
			<div class="col-sm-12">
				<div class="ibox float-e-margins">
					<div class="ibox-content">
						<form class="form-horizontal m-t" id="signupForm">
						<input id="id" name="id" th:value="${jpWord.id}" type="hidden">
                        <div class="form-group">
                            <label class="col-sm-2 control-label">课程名称：</label>
                            <div class="col-sm-8">
                                <input id="lesson" th:value="${lesson}" disabled class="form-control" type="text">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">单词：</label>
                            <div class="col-sm-4">
                                <input id="wordCn" name="wordCn" th:value="${jpWord.wordCn}" class="form-control" type="text">
                            </div>
                            <label class="col-sm-2 control-label">单词假名：</label>
                            <div class="col-sm-4">
                                <input id="word" name="word" th:value="${jpWord.word}" class="form-control" type="text" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">词性：</label>
                            <div class="col-sm-4">
                                <input id="wordType" name="wordType" th:value="${jpWord.wordType}" class="form-control" type="text">
                            </div>
                            <label class="col-sm-2 control-label">发音：</label>
                            <div class="col-sm-4">
                                <input id="wordVoice" name="wordVoice" th:value="${jpWord.wordVoice}" class="form-control" type="text">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">中文含义：</label>
                            <div class="col-sm-8">
                                <input id="zhMean" name="zhMean" th:value="${jpWord.zhMean}" class="form-control" type="text" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-8 col-sm-offset-2">
                                <button type="submit" class="btn btn-primary">提交</button>
                            </div>
                        </div>
						</form>
					</div>
				</div>
			</div>
	</div>
	</div>
	<div th:include="include::footer"></div>
	<script type="text/javascript" src="/js/appjs/rwe/jp/word/edit.js"></script>
</body>
</html>
