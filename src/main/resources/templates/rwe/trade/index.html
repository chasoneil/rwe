<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
	<div class="wrapper wrapper-content ">
		<div class="col-sm-12">
			<div class="ibox ibox-content">
				<div class="ibox-body">
					<div class="fixed-table-toolbar">
						<div class="columns pull-left">
							<button type="button" class="btn btn-success" onclick="importTrade()" data-placeholder="支持导入xls/xlsx/csv/txt格式文件">
								<i class="fa fa-upload" aria-hidden="true"></i> 导入账单
							</button>
							<button class="btn btn-success" onclick="exportTrade()">
								<i class="fa fa-download" aria-hidden="true"></i> 导出账单
							</button>
							<button type="button" class="btn btn-primary" onclick="add()">
								<i class="fa fa-pencil" aria-hidden="true"></i> 记一笔
							</button>
							<button type="button" class="btn  btn-danger"
								onclick="batchRemove()">
								<i class="fa fa-trash" aria-hidden="true"></i> 批量删除
							</button>
						</div>
						<div class="columns pull-right" style="margin-left: 5px;">
							<button class="btn btn-success" onclick="reload()"> 查询</button>
						</div>
						<div class="columns pull-right">
							<input id="searchTradeName" type="text" class="form-control" placeholder="订单号/客户名称/产品名称">
						</div>
					</div>
					<table id="exampleTable" data-mobile-responsive="true"></table>
				</div>
			</div>
		</div>
	</div>
	<div th:include="include :: footer"></div>
	<script type="text/javascript"
		src="/js/appjs/rtm/trade/index.js"></script>
</body>
</html>
