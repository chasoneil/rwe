<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
	<div class="wrapper wrapper-content ">
		<div class="row">
			<div class="col-sm-12">
				<div class="ibox float-e-margins">
					<div class="ibox-content">
						<form class="form-horizontal m-t" id="signupForm">
						<input name="id" th:value="${deepType.id}" type="hidden">
						<input name="userId" th:value="${deepType.userId}" type="hidden">
                        <div class="form-group">
                            <label class="col-sm-2 control-label">深度支出名称：<span class="text-danger">*</span></label>
                            <div class="col-sm-8">
                                <input name="deepTypeName" class="form-control" th:value="${deepType.deepTypeName}" placeholder="请输入深度支出名称" type="text">
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-8 col-sm-offset-2">
                                <button type="submit" class="btn btn-primary">提交</button>
                            </div>
                        </div>
						</form>
					</div>
				</div>
			</div>
	</div>
	</div>
	<div th:include="include::footer"></div>
	<script type="text/javascript" src="/js/appjs/rtm/deep_type/edit.js"></script>
</body>
</html>
