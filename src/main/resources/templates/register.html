<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人助手</title>
    <meta name="keywords" content="个人助手注册用户">
    <meta name="description" content="个人助手注册用户页面">

    <link rel="shortcut icon" href="favicon.ico"> <link href="/css/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="/css/font-awesome.css?v=4.4.0" rel="stylesheet">
    <link href="/css/plugins/iCheck/custom.css" rel="stylesheet">
    <link href="/css/animate.css" rel="stylesheet">
    <link href="/css/style.css?v=4.1.0" rel="stylesheet">
    <link href="/css/login.css">
    <script>if(window.top !== window.self){ window.top.location = window.location;}</script>
</head>

<body class="signin">

    <div class="middle-box text-center loginscreen   animated fadeInDown">
        <div>
            <div>
                <h1 class="logo-name">CP</h1>
            </div>
            <h3>欢迎注册 个人助手</h3>
            <p>创建一个助手新账户</p>
            <form class="m-t" role="form" id="signupForm">
                <div class="form-group">
                    <input type="text" id="username" name="username" class="form-control" placeholder="请输入用户名" required="">
                </div>
                <div class="form-group">
                    <input type="password" id="pwd" name="pwd" class="form-control" placeholder="请输入密码" required="">
                </div>
                <div class="form-group">
                    <input type="password" id="confirmPwd" name="confirmPwd" class="form-control" placeholder="请再次输入密码" required="">
                </div>
                <div class="form-group text-left">
                    <div class="checkbox i-checks">
                        <label class="no-padding">
                            <input name="agreement" value="1" type="checkbox"><i></i> 我同意注册协议</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary block full-width m-b">注 册</button>

                <p class="text-muted text-center"><small>已经有账户了？</small><a onclick="">点此登录</a>
                </p>

            </form>
        </div>
    </div>

    <!-- 全局js -->
    <script src="/js/plugins/validate/jquery.validate.min.js"></script>
    <script src="/js/jquery.min.js?v=2.1.4"></script>
    <script src="/js/bootstrap.min.js?v=3.3.6"></script>
    <!-- iCheck -->
    <script src="/js/plugins/iCheck/icheck.min.js"></script>
    <script>
        $(document).ready(function () {
            $('.i-checks').iCheck({
                checkboxClass: 'icheckbox_square-green',
                radioClass: 'iradio_square-green',
            });

            validateRule();
        });

        $.validator.setDefaults({
            submitHandler: function () {
                register();
            }
        });

        function register() {

            let pwd = $('#pwd').val();
            let confirmPwd = $('#confirmPwd').val();

            if (pwd !== confirmPwd) {
                layer.msg('两次输入的密码不一致');
                return;
            }

            $.ajax({
                type: "POST",
                url: "/register/doRegister",
                data: $('#signupForm').serialize(),
                success: function (r) {
                    if (r.code === 0) {
                        parent.location.href = '/login';
                        layer.msg('注册成功');
                    } else {
                        layer.msg('注册失败:' + r.msg);
                    }
                }
            });
        }

        function validateRule() {
            var icon = "<i class='fa fa-times-circle'></i> ";
            $("#signupForm").validate({
                rules: {
                    username: {
                        required: true
                    },
                    pwd: {
                        required: true
                    },
                    confirmPwd: {
                        required: true
                    }
                },
                messages: {
                    username: {
                        required: icon + "请输入您的用户名",
                    },
                    pwd: {
                        required: icon + "请输入您的密码",
                    },
                    confirmPwd: {
                        required: icon + "请再次输入您的密码",
                    }
                }
            })
        }


    </script>
</body>
</html>
